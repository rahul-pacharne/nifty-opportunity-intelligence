services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: noi
      POSTGRES_PASSWORD: noi
      POSTGRES_DB: noi
    ports:
      - "5432:5432"
    volumes:
      - noi-pg:/var/lib/postgresql/data
      - ./migrations/001_market_observations.sql:/docker-entrypoint-initdb.d/001_market_observations.sql:ro

volumes:
  noi-pg:
