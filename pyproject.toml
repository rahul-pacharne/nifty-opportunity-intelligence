[project]
name = "nifty-opportunity-intelligence"
version = "0.1.0"
description = "Manual gap-opportunity intelligence for Nifty 50 and Bank Nifty."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
